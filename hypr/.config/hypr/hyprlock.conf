source = ./colors.conf

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# --- BACKGROUND ---
background {
    monitor =
    # Use the current wallpaper (if you have a consistent path)
    # or leave it commented to use the solid Matugen background color
    # path = ~/Pictures/Wallpapers/current_wallpaper.jpg 
    
    color = $background
    
    # Blur effect for a "frosted glass" look
    blur_passes = 3
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- CLOCK ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
}

# --- DATE ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $on_background
    font_size = 25
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 20
    halign = center
    valign = center
}

# --- INPUT FIELD ---
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.25 
    dots_spacing = 0.2 
    dots_center = true
    dots_rounding = -1 
    
    # Colors
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_background
    check_color = $tertiary
    fail_color = $error
    
    # Text
    placeholder_text = <i> Password... </i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    # Positioning
    position = 0, -100
    halign = center
    valign = center
    
    # Style
    rounding = -1 
    fade_on_empty = false
    hide_input = false
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
}

# --- FINGERPRINT ---
auth {
    fingerprint:enabled = true
}
