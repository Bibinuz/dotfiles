# Import the Matugen colors
source = ./colors.conf

general {
    border_size = 2
    col.active_border = $primary $secondary 45deg
    col.inactive_border = $outline
    resize_on_border = true
    gaps_in = 1
    gaps_out = 0 
    layout = scrolling
    allow_tearing = false
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 4
    inactive_opacity = 0.85
    blur {
        enabled = true
        size = 5        
        passes = 3     
        new_optimizations = true
        ignore_opacity = true
    }

}

animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    bezier = workswitch,0.04, 0.27, 0.58, 1

    animation = windows, 1, 3, wind, slide
    animation = windowsIn, 1, 4, winIn, slide
    animation = windowsOut, 1, 3, winOut, slide
    animation = windowsMove, 1, 3, wind, slide

    animation = fade, 1, 10, default
    
    animation = workspaces, 1, 3, workswitch,slidevert

    animation = borderangle, 1, 30, liner, loop
}

xwayland {
    force_zero_scaling = true
}
