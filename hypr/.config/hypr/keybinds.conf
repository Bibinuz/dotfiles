$mainMod = super

# Brightness through brightnessctl
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Open apps
bind = $mainMod, return, exec, $terminal
bind = $mainMod, space, exec, pkill $menuApp || $menu
bind = $mainMod SHIFT, space, exec, ~/.config/rofi/wallpaper-gallery.sh
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod SHIFT, T, exec, $textEditor
bind = $mainMod SHIFT, B, exec, $browser
bind = $mainMod SHIFT, S, exec, steam
bind = $mainMod SHIFT CONTROL, S, exec, spotify-launcher

bind = $mainMod SHIFT, A, exec, ~/.config/hypr/scripts/launch-webapp.sh "https://gemini.google.com"
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/launch-webapp.sh "https://github.com/Bibinuz"


# General commands
bind = $mainMod, W, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, V, togglefloating, 
bind = $mainMod, E, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, # dwindle
bind = $mainMod, P, pin,
bind = $mainMod, B, exec, pkill $bar || $bar
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod SHIFT, P, exec, hyprpicker
bind = $mainMod, escape, exec, pkill wlogout || wlogout

# Scrolling binds 
bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod ALT, period, layoutmsg, swapcol r 
bind = $mainMod ALT, comma, layoutmsg, swapcol l 
bind = $mainMod SHIFT, period, layoutmsg, colresize +0.1
bind = $mainMod SHIFT, comma, layoutmsg, colresize -0.1


# Screenshots
bind = , Print, exec, hyprshot -m window
bind = shift, Print, exec, hyprshot -m region

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10



# Mouse wheel to change workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

#Moue to move/resize and the option to use keyboard to remove the need for clicks, useful on touchpad
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, Control_L, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, ALT_L, resizewindow

binde = $mainMod ALT, right, resizeactive, 20 0
binde = $mainMod ALT, left, resizeactive, -20 0
binde = $mainMod ALT, up, resizeactive, 0 -20
binde = $mainMod ALT, down, resizeactive, 0 20


bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

