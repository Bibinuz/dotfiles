# ~/.config/matugen/templates/starship.toml

# 1. Global Format
format = """
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# 2. Palette (Optional: Define custom palettes if you prefer referencing names)
# We will use inline styles with Matugen variables for simplicity.

# 3. Essential Modules

[directory]
format = "[](@{primary.hex})[ $path ](bg:@{primary.hex} fg:@{on_primary.hex} bold)[](fg:@{primary.hex} bg:none) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[](@{secondary.hex})[ $symbol$branch ](bg:@{secondary.hex} fg:@{on_secondary.hex} bold)[](fg:@{secondary.hex} bg:none) "
symbol = " "

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bold @{tertiary.hex}"
conflicted = "🏳"
up_to_date = "✅"
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
staged = " "
modified = " "
deleted = " "
renamed = " "

# --- Language Runtimes (The "Essentials") ---

[c]
format = "[](@{tertiary.hex})[ $symbol($version) ](bg:@{tertiary.hex} fg:@{on_tertiary.hex} bold)[](fg:@{tertiary.hex} bg:none) "
symbol = " "

[rust]
format = "[](@{tertiary.hex})[ $symbol($version) ](bg:@{tertiary.hex} fg:@{on_tertiary.hex} bold)[](fg:@{tertiary.hex} bg:none) "
symbol = " "

[golang]
format = "[](@{tertiary.hex})[ $symbol($version) ](bg:@{tertiary.hex} fg:@{on_tertiary.hex} bold)[](fg:@{tertiary.hex} bg:none) "
symbol = " "

[nodejs]
format = "[](@{tertiary.hex})[ $symbol($version) ](bg:@{tertiary.hex} fg:@{on_tertiary.hex} bold)[](fg:@{tertiary.hex} bg:none) "
symbol = " "

[python]
format = "[](@{tertiary.hex})[ $symbol($version) ](bg:@{tertiary.hex} fg:@{on_tertiary.hex} bold)[](fg:@{tertiary.hex} bg:none) "
symbol = " "

# --- System & Status ---

[cmd_duration]
min_time = 2000
format = "took [$duration](bold @{primary.hex}) "

[character]
success_symbol = "[➜](bold @{primary.hex})"
error_symbol = "[➜](bold @{error.hex})"
